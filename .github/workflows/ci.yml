name: Tracker checks and GitHub Pages deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore last validated QuestLog snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .cache/questlog-schedule.json
          key: questlog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: questlog-v1-
      - name: Check QuestLog schedules
        if: github.event_name != 'pull_request'
        run: node scripts/refresh-schedules.mjs
      - name: Test tracker
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Validate artifact
        run: npm run validate
      - name: Cache validated QuestLog snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .cache/questlog-schedule.json
          key: questlog-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
